server:
  port: 8080
spring:
  application:
    name: edu-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: ${EDU_AUTH_URI:http://localhost:9001}
              predicates: [ Path=/api/auth/** ]
            - id: system
              uri: ${EDU_SYSTEM_URI:http://localhost:9002}
              predicates: [ Path=/api/system/** ]
            - id: course
              uri: ${EDU_COURSE_URI:http://localhost:9003}
              predicates: [ Path=/api/course/** ]
            - id: order
              uri: ${EDU_ORDER_URI:http://localhost:9004}
              predicates: [ Path=/api/order/** ]
            - id: learning
              uri: ${EDU_LEARNING_URI:http://localhost:9005}
              predicates: [ Path=/api/learning/** ]
            - id: exam
              uri: ${EDU_EXAM_URI:http://localhost:9006}
              predicates: [ Path=/api/exam/** ]
            - id: marketing
              uri: ${EDU_MARKETING_URI:http://localhost:9007}
              predicates: [ Path=/api/marketing/** ]
            - id: message
              uri: ${EDU_MESSAGE_URI:http://localhost:9008}
              predicates: [ Path=/api/message/** ]
            - id: statistics
              uri: ${EDU_STATISTICS_URI:http://localhost:9009}
              predicates: [ Path=/api/statistics/** ]
